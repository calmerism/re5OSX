[package]
name = "re5osx-gamec"
description = "re5osx-game's build script as a program: compiles the player's game.wasm into libre5osx_game.a on their own Mac"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The same source as the build script, run with the environment cargo would
# give it (platform/macos/link-app sets it up).
[[bin]]
name = "re5osx-gamec"
path = "../re5osx-game/build/main.rs"

[dependencies]
anyhow.workspace = true
cc.workspace = true
sha2.workspace = true
wasmparser.workspace = true
